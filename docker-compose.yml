services:
  eureka-server:
    build:
      context: ./eureka-server
      dockerfile: Dockerfile
    container_name: eureka_server
    ports:
      - "8761:8761"
    networks:
      - microservices-net

  config-server:
    build:
      context: ./config-server
      dockerfile: Dockerfile
    container_name: config_server
    depends_on:
      - eureka-server
    environment:
      GITHUB_REPO_URL: https://github.com/leonardo-muniz/ese-pb-2026
      GIT_CONFIG_BRANCH: config-server
    ports:
      - "8888:8888"
    networks:
      - microservices-net

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: api_gateway
    depends_on:
      - config-server
      - eureka-server
    environment:
      CONFIG_URL: http://config-server:8888
      EUREKA_URL: http://eureka-server:8761/eureka
    ports:
      - "8080:8080"
    networks:
      - microservices-net

  user-db:
    image: postgres:18-alpine
    container_name: user_service_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres # PLEASE CHANGE !
      POSTGRES_DB: user_db
    ports:
      - "5432:5432"
    volumes:
      - user_pg_data:/var/lib/postgresql
    networks:
      - microservices-net

  user-service:
    build:
      context: ./user-service
      dockerfile: Dockerfile
    container_name: user_service_app
    depends_on:
      - config-server
      - eureka-server
      - user-db
    environment:
      CONFIG_URL: http://config-server:8888
      DB_URL: jdbc:postgresql://user-db:5432/user_db
      DB_USER: postgres
      DB_PASSWORD: postgres # PLEASE CHANGE !
      DB_DRIVER: org.postgresql.Driver
      DB_DIALECT: org.hibernate.dialect.PostgreSQLDialect
      EUREKA_URL: http://eureka-server:8761/eureka
      SPRING_SEC_USERNAME: admin
      SPRING_SEC_PASSWORD: admin123 # PLEASE CHANGE !
    ports:
      - "8081:8081"
    networks:
      - microservices-net

  wallet-db:
    image: postgres:18-alpine
    container_name: wallet_service_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres # PLEASE CHANGE !
      POSTGRES_DB: wallet_service_db
    ports:
      - "5433:5433"
    volumes:
      - wallet_pg_data:/var/lib/postgresql
    networks:
      - microservices-net

  wallet-service:
    build:
      context: ./wallet-service
      dockerfile: Dockerfile
    container_name: wallet_service_app
    depends_on:
      - config-server
      - eureka-server
      - wallet-db
    environment:
      CONFIG_URL: http://config-server:8888
      DB_URL: jdbc:postgresql://wallet-db:5433/wallet_db
      DB_USER: postgres
      DB_PASSWORD: postgres # PLEASE CHANGE !
      DB_DRIVER: org.postgresql.Driver
      DB_DIALECT: org.hibernate.dialect.PostgreSQLDialect
      EUREKA_URL: http://eureka-server:8761/eureka
      SPRING_SEC_USERNAME: admin
      SPRING_SEC_PASSWORD: admin123 # PLEASE CHANGE !
    ports:
      - "8082:8082"
    networks:
      - microservices-net

  trade-db:
    image: postgres:18-alpine
    container_name: trade_service_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres # PLEASE CHANGE !
      POSTGRES_DB: trade_db
    ports:
      - "5434:5434"
    volumes:
      - trade_pg_data:/var/lib/postgresql
    networks:
      - microservices-net

  trade-service:
    build:
      context: ./trade-service
      dockerfile: Dockerfile
    container_name: trade_service_app
    depends_on:
      - config-server
      - eureka-server
      - trade-db
    environment:
      CONFIG_URL: http://config-server:8888
      DB_URL: jdbc:postgresql://trade-db:5434/trade_db
      DB_USER: postgres
      DB_PASSWORD: postgres # PLEASE CHANGE !
      DB_DRIVER: org.postgresql.Driver
      DB_DIALECT: org.hibernate.dialect.PostgreSQLDialect
      EUREKA_URL: http://eureka-server:8761/eureka
      SPRING_SEC_USERNAME: admin
      SPRING_SEC_PASSWORD: admin123 # PLEASE CHANGE !
    ports:
      - "8083:8083"
    networks:
      - microservices-net

volumes:
  user_pg_data:
  wallet_pg_data:
  trade_pg_data:

networks:
  microservices-net:
    driver: bridge