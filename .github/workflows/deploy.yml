name: Build & Push Microservices Docker Images

on:
  push:
    branches: [ "tp3" ]

# Permissão explícita para criar pacotes no GHCR
permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - 'eureka-server'
          - 'config-server'
          - 'api-gateway'
          - 'user-service'
          - 'wallet-service'
          - 'trade-service'
          - 'exchange-frontend-ts'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      # 1. Compila a aplicação
      - name: Build JAR
        if: matrix.service != 'exchange-frontend-ts'
        working-directory: ${{ matrix.service }}
        run: |
          if [ -f "mvnw" ]; then chmod +x mvnw && ./mvnw clean package -DskipTests; else mvn clean package -DskipTests; fi

      # 2. Converte o nome do usuário/organização para minúsculas (requisito do GHCR)
      - name: Lowercase Repository Owner
        id: repo_owner
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_OUTPUT

      # 3. Autentica no GitHub Container Registry
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 4. Constrói e envia a Imagem Docker com prefixo ecommerce-
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: |
            ghcr.io/${{ steps.repo_owner.outputs.owner }}/exchange_api-${{ matrix.service }}:latest
            ghcr.io/${{ steps.repo_owner.outputs.owner }}/exchange_api-${{ matrix.service }}:${{ github.sha }}